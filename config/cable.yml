# Scanner jobs run in a separate process from the web server.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds

test:
  adapter: test

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
